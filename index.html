
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arcade.Gogo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#060818;
color:white;
overflow-x:hidden;
}

/* Background Glow */

body::before{
content:"";
position:fixed;
width:900px;
height:900px;
background:radial-gradient(circle,#5d3bff55,transparent 70%);
top:-300px;
right:-200px;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:800px;
height:800px;
background:radial-gradient(circle,#00b7ff33,transparent 70%);
bottom:-300px;
left:-200px;
z-index:-1;
}

/* NAVBAR */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:rgba(15,18,40,.85);
backdrop-filter:blur(20px);
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid #2f3d70;
}

.logo{
font-size:34px;
font-weight:bold;
color:#5db9ff;
}

.logo span{
color:#b05cff;
}

nav a{
text-decoration:none;
color:white;
margin-left:35px;
font-size:18px;
transition:.3s;
}

nav a:hover{
color:#73c2ff;
}

/* HERO */

.hero{

text-align:center;
padding:90px 20px;

}

.hero h1{

font-size:70px;
font-weight:bold;
background:linear-gradient(90deg,#5db9ff,#b05cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.hero p{

font-size:23px;
margin-top:20px;
color:#c5c8d7;

}

/* SEARCH */

.search{

margin-top:50px;

display:flex;
justify-content:center;

}

#search{

width:700px;
max-width:90%;
padding:18px 25px;
font-size:20px;

border:none;

border-radius:60px;

background:#151d3d;

color:white;

outline:none;

box-shadow:0 0 30px rgba(89,157,255,.25);

transition:.3s;

}

#search:focus{

box-shadow:0 0 40px #5db9ff;

}

/* SECTION */

section{

padding:40px 60px;

}

.section-title{

font-size:34px;

margin-bottom:30px;

}

/* GAME GRID */

.games{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(220px,1fr));

gap:28px;

}

.game{

background:rgba(23,30,62,.9);

border-radius:26px;

overflow:hidden;

cursor:pointer;

transition:.35s;

border:1px solid #2f3d70;

}

.game:hover{

transform:translateY(-10px);

box-shadow:0 0 30px #5d8fff;

}

.game img{

width:100%;

height:180px;

object-fit:cover;

background:#2a3566;

}

.game h3{

padding:18px;

text-align:center;

font-size:20px;

}

/* FOOTER */

footer{

padding:40px;

text-align:center;

color:#8f98bc;

}

@media(max-width:900px){

header{

padding:20px;

flex-direction:column;

gap:20px;

}

nav{

display:flex;

flex-wrap:wrap;

justify-content:center;

}

.hero h1{

font-size:48px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
Arcade<span>.Gogo</span>
</div>

<nav>

<a href="#">Home</a>
<a href="#">Games</a>
<a href="#">New</a>
<a href="#">Popular</a>

</nav>

</header>

<div class="hero">

<h1>Play. Explore. Enjoy.</h1>

<p>The best browser games all in one place.</p>

<div class="search">

<input
type="text"
id="search"
placeholder="Search games...">

</div>

</div>

<section>

<h2 class="section-title">
 Featured Games
</h2>

<div class="games" id="games">

<!-- GAME 1 -->
<div class="game">
<img src="2048.png/2048.png" alt="2048">
<h3> 2048 </h3>
</div>


<!-- GAME 2 -->
<div class="game">
<img src="images/game2.png">
<h3>GAME 2</h3>
</div>

<!-- GAME 3 -->
<div class="game">
<img src="images/game3.png">
<h3>GAME 3</h3>
</div>

<!-- GAME 4 -->
<div class="game">
<img src="images/game4.png">
<h3>GAME 4</h3>
</div>

<!-- GAME 5 -->
<div class="game">
<img src="images/game5.png">
<h3>GAME 5</h3>
</div>

<!-- GAME 6 -->
<div class="game">
<img src="images/game6.png">
<h3>GAME 6</h3>
</div>

</div>

</section>

<footer>

© 2026 Arcade.Gogo

</footer>

<script>

const search=document.getElementById("search");

search.addEventListener("keyup",function(){

let filter=this.value.toLowerCase();

let cards=document.querySelectorAll(".game");

cards.forEach(function(card){

let title=card.innerText.toLowerCase();

if(title.includes(filter)){

card.style.display="block";

}else{

card.style.display="none";

}

});

});

</script>

</body>
</html>
